# Local run of RELAY on the Plow OpenClaw base:  plow-agents deploy --local --line <ln_…>
# plow-credentials is written by `plow-agents mint` / `deploy --local`; it is git- and docker-ignored.
services:
  agent:
    build: .
    # Stable hostname lets OpenClaw reclaim its gateway lease from a stopped container right
    # away (it checks host+pid); otherwise a rebuild waits up to 5 min for the lease to expire.
    hostname: relay-agent
    env_file: ./plow-credentials
    environment:
      RELAY_TZ: ${RELAY_TZ:-UTC}   # team timezone for "today/tonight", e.g. RELAY_TZ=Asia/Kolkata
      RELAY_TEAM: ${RELAY_TEAM:-}  # teammates, e.g. "Aaditya,Priya,Meera"; everyone else counts as external
    volumes:
      - state:/var/lib/plow   # RELAY ledger lives here (RELAY_DATA), kept across restarts
    stop_grace_period: 35s
volumes:
  state:
